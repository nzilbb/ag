<h2> Stanford POS Tagger</h2>

<p> Annotator that tags <a href="https://tokipona.org/">Toki Pona</a> words
  with their part of speech (POS) according to the 
  <a href="https://github.com/cubedhuang/ilo-nasin/">ilo-nasin</a> tagger. </p>

<p> The <em>il-nasin</em> tagger is a NodeJS package published on
  <a href="https://www.npmjs.com/package/ilo-nasin">npm</a>
  So in order to install and use the annotator, <a href="https://nodejs.org/">nodejs and npm</a>
  must first be installed. </p>
